schema_version = "1.4"
artifacts = ["/app/submission"]
[metadata]
task_id = "orientation-dev"
split = "development"
condition = "C"
[agent]
timeout_sec = 180
[environment]
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
[verifier]
timeout_sec = 60
environment_mode = "separate"
[verifier.environment]
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "no-network"
