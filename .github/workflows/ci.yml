name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m unittest discover -s tools/pygments_lamlet -p 'test_*.py'
      - run: zensical build --strict
      - run: python tools/check_docs.py target/docs-site
      - uses: actions/upload-artifact@v7
        with:
          name: lamlet-documentation
          path: target/docs-site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        with:
          path: target/docs-site
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python3 tools/gallery.py --check
      - run: python3 demo/run.py
      - uses: actions/upload-artifact@v7
        with:
          name: lamlet-demo
          path: |
            target/demo/index.html
            target/demo/report.json
          if-no-files-found: error
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/defect_corpus.py audit
      - run: python3 tools/defect_replay.py verify --run docs/assets/defect-corpus/2026-11-09
      - run: python3 tools/defect_diagnostics.py verify --archive docs/assets/defect-diagnostics/2026-11-09
      - run: python3 tools/defect_diagnostics.py verify --archive docs/assets/defect-diagnostics/2026-11-09-gcmc
      - run: python3 tools/defect_discovery.py verify --archive docs/assets/defect-discovery/2026-11-09
      - run: python3 tools/lint_evaluation.py --baseline docs/assets/lint-evaluation/report.json
      - run: python3 tools/lint_evaluation.py --report target/lint-evaluation/repeated.json
      - run: cmp target/lint-evaluation/report.json target/lint-evaluation/repeated.json
      - run: python3 tools/corpus.py fetch
      - run: git fetch --depth 1 origin 0165101ce505734e8fb249694b22e295a7ab4182
        working-directory: target/corpus/sources/lammps
      - run: python3 tools/lammps_docs.py --checkout target/corpus/sources/lammps --output target/lammps-manual/index.json
      - run: python3 tools/manual_rules.py --check
      - run: python3 tools/corpus.py audit --inventory target/corpus/inventory.json
      - run: python3 tools/evaluation.py fetch
      - run: python3 tools/evaluation.py replay
      - run: python3 tools/harbor_tasks.py --condition C --output target/harbor-preview/C
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-evaluation
          path: |
            target/corpus/report.json
            target/corpus/inventory.json
            target/evaluation/replay.json
            target/harbor-preview/C/preparation.json
            target/lint-evaluation/report.json
          if-no-files-found: warn
  pages:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: [docs, rust, corpus]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
